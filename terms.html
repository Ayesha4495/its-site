<style>
:root{--bg:#f2f5fb;--card:#fff;--ink:#0f1b2d;--mut:#5b6b82;--line:#dfe6f2;--acc:#2f5bff;--accsoft:#e8eeff;--ok:#0f9d6e;--warn:#d98a00;--bad:#e03a2f;--hero:#0f1b2d;--herotxt:#f2f5fb;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--card:#131c2e;--ink:#e8edf7;--mut:#93a3bd;--line:#24314a;--accsoft:#1a2a55;--hero:#070c17}}
:root[data-theme="dark"]{--bg:#0b1220;--card:#131c2e;--ink:#e8edf7;--mut:#93a3bd;--line:#24314a;--accsoft:#1a2a55;--hero:#070c17}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 'DM Sans',system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque','DM Sans',sans-serif;line-height:1.1;margin:0}
a{color:var(--acc)}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
nav{display:flex;justify-content:space-between;align-items:center;padding:16px 0;color:var(--herotxt)}
nav b{font:800 22px 'Bricolage Grotesque';letter-spacing:-.02em}
nav a{color:var(--herotxt);text-decoration:none;margin-left:18px;font-size:15px;opacity:.85}
.hero{background:var(--hero);color:var(--herotxt);position:relative;overflow:hidden;padding-bottom:64px}
.hero{padding-top:env(safe-area-inset-top,0px)}.hero svg.bg{position:absolute;right:-60px;top:-40px;width:520px;max-width:80%;opacity:.55;pointer-events:none}
.hero h1{font-size:clamp(34px,6vw,58px);font-weight:800;letter-spacing:-.03em;max-width:700px;margin-top:36px}
.hero p{max-width:560px;color:#b9c6dc;font-size:18px;margin:16px 0 0}
.serp{position:relative;background:var(--card);color:var(--ink);border-radius:18px;padding:22px;margin-top:34px;box-shadow:0 20px 50px rgba(0,0,0,.35);max-width:760px}
.serp .url{font-size:13px;color:var(--mut);display:flex;gap:8px;align-items:center}
.serp .fav{width:22px;height:22px;border-radius:50%;background:var(--accsoft);display:grid;place-items:center;font-size:12px}
.serp .t{font:400 20px/1.3 Arial,sans-serif;color:#1a0dab;margin:4px 0;word-break:break-word}
:root[data-theme="dark"] .serp .t{color:#8ab4f8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .serp .t{color:#8ab4f8}}
.serp .d{font:400 14px/1.58 Arial,sans-serif;color:var(--mut);word-break:break-word}
main{padding:40px 0 20px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 14px;margin-top:-26px;position:relative}
.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 16px;border-radius:999px;font:500 15px 'DM Sans';cursor:pointer}
.tabs button[aria-selected=true]{background:var(--acc);color:#fff;border-color:var(--acc)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;display:none}
.panel.on{display:block}
.panel h2{font-size:28px;margin-bottom:6px}
.sub{color:var(--mut);margin:0 0 18px}
label{display:block;font-weight:500;font-size:14px;margin:12px 0 5px}
input,textarea,select{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:11px 12px;font:16px 'DM Sans'}
textarea{min-height:110px;resize:vertical}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:11px 18px;font:700 15px 'DM Sans';cursor:pointer;margin-top:16px}
.btn.alt{background:var(--accsoft);color:var(--acc)}
.meter{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;width:0;background:var(--ok);transition:width .2s,background .2s}
.cnt{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-top:5px;gap:10px;flex-wrap:wrap}
.cnt b.ok{color:var(--ok)}.cnt b.warn{color:var(--warn)}.cnt b.bad{color:var(--bad)}
.res{border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px;background:var(--bg)}
.res p{margin:0 0 8px}
.res .meta{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;flex-wrap:wrap}
.res button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:5px 12px;cursor:pointer;font:500 13px 'DM Sans'}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:16px}
.stats div{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px}
.stats b{display:block;font:800 30px 'Bricolage Grotesque'}
.stats span{font-size:13px;color:var(--mut)}
table{width:100%;border-collapse:collapse;margin-top:14px;font-size:15px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}
td .bar{height:6px;border-radius:6px;background:var(--acc);min-width:2px}
.scroll{overflow-x:auto}
pre{background:#0f1b2d;color:#d6e4ff;border-radius:12px;padding:16px;overflow:auto;font:13px/1.55 ui-monospace,Menlo,monospace;max-height:380px;margin:12px 0 0}
.ad{margin:26px 0;border:1.5px dashed var(--line);border-radius:12px;min-height:90px;display:grid;place-items:center;color:var(--mut);font-size:13px;text-align:center;padding:10px}
section.blk{margin-top:44px}
section.blk h2{font-size:30px;margin-bottom:8px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.card h3{font-size:20px;margin-bottom:6px}
.card p{margin:0;color:var(--mut);font-size:15px}
.card .tag{display:inline-block;background:var(--accsoft);color:var(--acc);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700;margin-bottom:10px}
.plan.pro{border:2px solid var(--acc)}
.plan ul{padding-left:18px;margin:10px 0 0;color:var(--mut);font-size:15px}
.price{font:800 34px 'Bricolage Grotesque';margin:6px 0}
.guide article{margin-top:30px;max-width:720px}.guide h3{font-size:24px;margin-bottom:8px}.guide p{color:var(--mut)}.page-sec{max-width:720px}.page-sec p{color:var(--mut)}footer a{margin-right:14px}footer{margin-top:50px;padding:30px 0 calc(30px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);color:var(--mut);font-size:14px}
.faq details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:10px}
.faq summary{cursor:pointer;font-weight:700}
.faq p{color:var(--mut);margin:8px 0 0}
.tabs a{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 16px;border-radius:999px;font:500 15px 'DM Sans';text-decoration:none}.tabs a[aria-current=page]{background:var(--acc);color:#fff;border-color:var(--acc)}.card h3 a{color:var(--ink);text-decoration:none}</style>
